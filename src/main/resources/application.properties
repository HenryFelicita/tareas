spring.application.name=tareas
# Conexión a PostgreSQL: dirección de la base de datos tareas, usuario y contraseña.
# La contraseña no se escribe aquí porque este fichero se guarda en el repositorio:
# se lee de la variable de entorno POSTGRES_PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5432/tareas
spring.datasource.username=postgres
spring.datasource.password=${POSTGRES_PASSWORD}

# validate: Hibernate no toca las tablas (las crea el script SQL), solo comprueba al arrancar
# que cada entidad coincide con su tabla.
spring.jpa.hibernate.ddl-auto=validate

# Desactiva la sesión de Hibernate abierta durante la vista (como en las sesiones anteriores).
spring.jpa.open-in-view=false

# Escribe en la consola cada sentencia SQL que genera Hibernate.
spring.jpa.show-sql=true